<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>학교생활기록부</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#f8fafc;}
header{padding:12px 20px;background:#1e293b;color:#fff;}
main{padding:16px;max-width:900px;margin:auto;}
h2{margin-top:32px;border-bottom:1px solid #cbd5e1;padding-bottom:4px;font-size:18px;}
form section{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
label{display:flex;flex-direction:column;font-size:13px;color:#334155;gap:4px;}
input,textarea,select{padding:6px 8px;font-size:14px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;}
textarea{min-height:80px;resize:vertical;}
#actions{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0;}
button{cursor:pointer;background:#2563eb;color:#fff;border:0;padding:8px 14px;font-size:14px;border-radius:4px;}
button.secondary{background:#475569;}
button.danger{background:#dc2626;}
.notice{font-size:12px;color:#64748b;margin-top:4px;}
@media print{
  header,#actions,.notice,.importExport{display:none;}
  body{background:#fff;}
  input,textarea,select{border:0;}
}
</style>
</head>
<body>
<header>
  학교생활기록부 입력 시스템
</header>
<main>
  <div class="notice">예시 템플릿입니다. 실제 개인정보 입력 전 보안/저장 정책을 반드시 점검하세요.</div>

  <h2>기본 정보</h2>
  <form id="recordForm">
    <section>
      <label>학생번호
        <input name="studentId" required>
      </label>
    </section>

    <h2>특기사항</h2>
    <section style="grid-template-columns:1fr;">
      <label>교과특성
        <textarea name="subject"></textarea>
      </label>
      <label>행동특성
        <textarea name="behavior"></textarea>
      </label>
      <label>창의적 체험활동(요약)
        <textarea name="creative"></textarea>
      </label>
      <label>진로 희망 / 상담 기록 요약
        <textarea name="career"></textarea>
      </label>
    </section>

    <h2>기타</h2>
    <section style="grid-template-columns:1fr;">
      <label>기타 사항
        <textarea name="extra"></textarea>
      </label>
    </section>
  </form>

  <div id="actions">
    <button id="saveBtn">저장(브라우저)</button>
    <button class="secondary" id="loadBtn">불러오기</button>
    <button class="secondary" id="exportBtn">JSON 내보내기</button>
    <button class="secondary" id="printBtn">인쇄</button>
    <button class="danger" id="clearBtn">로컬 초기화</button>
    <div class="importExport">
      <input type="file" id="importFile" accept=".json" style="display:none">
      <button class="secondary" id="importBtn">JSON 가져오기</button>
    </div>
  </div>
</main>

<script>
const LS_KEY = 'schoolRecordBook_v1';

function getAll() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { return []; }
}
function setAll(arr) {
  localStorage.setItem(LS_KEY, JSON.stringify(arr));
}

function formData() {
  const f = document.getElementById('recordForm');
  const data = {};
  [...f.elements].forEach(e=>{
    if (!e.name) return;
    data[e.name] = (e.value || '').trim();
  });
  return data;
}

function fillForm(d) {
  const f = document.getElementById('recordForm');
  [...f.elements].forEach(e=>{
    if (e.name && d[e.name] !== undefined) e.value = d[e.name];
  });
}

document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const data = getAll();
  const json = JSON.stringify(data, null, 2);

  // 지원 시: 사용자가 저장 위치/파일명을 직접 선택
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'schoolRecordBook.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(new Blob([json], { type: 'application/json' }));
      await writable.close();
      alert('저장 완료');
      return;
    } catch (e) {
      if (e.name !== 'AbortError') console.warn('Save picker error:', e);
      // 취소 또는 오류 시 아래 기본 다운로드로 폴백
    }
  }

  // 폴백: 기본 다운로드 폴더로 저장
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'schoolRecordBook.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const d = formData();
  if (!d.studentId) { alert('학생번호 필요'); return; }
  const arr = getAll();
  const idx = arr.findIndex(x=>x.studentId===d.studentId);
  if (idx>=0) arr[idx]=d; else arr.push(d);
  setAll(arr);
  alert('저장 완료');
});

document.getElementById('loadBtn').addEventListener('click', ()=>{
  const id = prompt('불러올 학생번호?');
  if (!id) return;
  const found = getAll().find(x=>x.studentId===id);
  if (!found) { alert('해당 학생번호 없음'); return; }
  fillForm(found);
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if (!confirm('모든 로컬 저장 기록 삭제?')) return;
  localStorage.removeItem(LS_KEY);
  alert('초기화 완료');
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const data = getAll();
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'schoolRecordBook.json';
  a.click();
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const arr = JSON.parse(reader.result);
      if (!Array.isArray(arr)) { alert('배열 JSON 필요'); return; }
      setAll(arr);
      alert('가져오기 완료');
    } catch {
      alert('JSON 파싱 오류');
    }
  };
  reader.readAsText(file,'utf-8');
});

document.getElementById('printBtn').addEventListener('click', ()=>window.print());
</script>
</body>
</html>
