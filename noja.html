<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>노자 도덕경 — 입력/해석/댓글</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f8fafc; }
    header { padding: 12px 16px; background: #1f2937; color: #fff; }
    .wrap { display: grid; grid-template-columns: 280px 1fr 380px; gap: 12px; padding: 12px; }
    @media (max-width: 1024px){ .wrap { grid-template-columns: 1fr; } }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
    .panel h3 { margin: 0; padding: 10px 12px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    .panel .body { padding: 12px; }
    .list { max-height: calc(100dvh - 220px); overflow: auto; } /* 높이 약간 줄임 */
    .list-item { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
    .list-item:hover { background: #f9fafb; }
    .list-item.active { background: #eef2ff; }
    .muted { color: #64748b; font-size: 12px; }
    label { display: block; font-size: 13px; color: #334155; margin: 8px 0 4px; }
    input[type="text"], textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 14px; }
    textarea { resize: vertical; min-height: 100px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { padding: 8px 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button.primary { background: #2563eb; color: #fff; border-color: #1d4ed8; }
    button.danger { background: #ef4444; color: #fff; border-color: #dc2626; }
    .view { white-space: pre-wrap; line-height: 1.6; }
    .sec { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e7eb; }
    .comment-form textarea { min-height: 70px; }
    .comment { border-bottom: 1px solid #f1f5f9; padding: 10px 0; }
    .comment .meta { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .comment .content { white-space: pre-wrap; }
    .reply-btn { font-size: 12px; color: #2563eb; background: transparent; border: 0; padding: 0; cursor: pointer; }
    .reply-box { margin-top: 6px; }
    .indent { border-left: 2px solid #e5e7eb; margin-left: 10px; padding-left: 10px; }
    .tools { display: flex; gap: 6px; align-items: center; }
    .search { display: flex; gap: 6px; margin-bottom: 8px; }
    .pill { display: inline-block; padding: 2px 8px; font-size: 12px; border: 1px solid #e5e7eb; border-radius: 999px; background: #f8fafc; color: #334155; }
  </style>
</head>
<body>
  <header>노자 도덕경 — 입력/해석/댓글</header>
  <div class="wrap">
    <!-- 좌: 장 목록 -->
    <div class="panel">
      <h3>장 목록</h3>
      <div class="body">
        <div class="search">
          <input id="search" type="text" placeholder="검색(원문/해석)">
          <span class="pill" id="countPill">0장</span>
        </div>
        <div class="row" style="margin-bottom:8px;">
          <button id="addBtn" class="primary">새 장 추가</button>
          <button id="delBtn" class="danger">선택 장 삭제</button>
        </div>
        <div id="chapterList" class="list"></div>

        <!-- 동기화 섹션 -->
        <div class="sec">
          <div class="muted">동기화(GitHub)</div>
          <div class="row">
            <button id="remoteLoadBtn">원격 불러오기</button>
            <button id="remoteSaveBtn">원격 저장</button>
            <button id="tokenBtn">토큰</button>
          </div>
          <div class="muted" id="remoteInfo">읽기는 공개, 저장은 토큰 필요</div>
        </div>
      </div>
    </div>

    <!-- 중: 입력/보기 -->
    <div class="panel">
      <h3 id="editorTitle">장 입력/수정</h3>
      <div class="body">
        <div class="row">
          <label style="min-width:120px;">장 번호
            <input id="chapNo" type="text" placeholder="예: 1">
          </label>
          <div class="tools">
            <button id="saveBtn" class="primary">저장</button>
            <button id="newBtn">비우기</button>
          </div>
        </div>
        <label>원문(한문)
          <textarea id="orig" placeholder="노자 도덕경 원문을 입력하세요."></textarea>
        </label>
        <label>해석(의역/주석)
          <textarea id="interp" placeholder="해석, 주석, 참고를 입력하세요."></textarea>
        </label>

        <div class="sec">
          <div class="muted">미리보기</div>
          <div class="view">
            <div class="muted">제 <span id="vNo">-</span> 장</div>
            <div><strong>원문</strong></div>
            <div id="vOrig" class="view"></div>
            <div style="height:6px;"></div>
            <div><strong>해석</strong></div>
            <div id="vInterp" class="view"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 우: 댓글 -->
    <div class="panel">
      <h3>댓글 · 답글</h3>
      <div class="body">
        <div class="muted" id="cmtHeader">선택된 장: 없음</div>
        <div class="comment-form">
          <label>이름(선택)
            <input id="cmtAuthor" type="text" placeholder="이름">
          </label>
          <label>내용
            <textarea id="cmtContent" placeholder="댓글을 입력하세요."></textarea>
          </label>
          <button id="cmtAddBtn" class="primary">댓글 등록</button>
        </div>
        <div class="sec">
          <div id="comments"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 저장 키
    const KS = {
      chapters: 'ddj_chapters_v1',
      comments: 'ddj_comments_v1' // { [chapNo]: Comment[] }
    };

    // GitHub 동기화 설정
    const GH = {
      owner: 'jinsaim',
      repo: 'jinsaim.github.io',
      branch: 'main',
      pathChapters: 'chemistry/ddj_chapters.json',
      pathComments: 'chemistry/ddj_comments.json'
    };
    const GH_TOKEN_KEY = 'ddj_github_token';

    // 유틸
    const esc = s => (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const nowISO = () => new Date().toISOString().replace('T',' ').slice(0,19);
    const b64 = txt => btoa(unescape(encodeURIComponent(txt)));
    const fromB64 = b64s => decodeURIComponent(escape(atob(b64s)));

    // 상태
    let chapters = loadChapters();
    let comments = loadComments();
    let currentNo = null;

    function loadChapters(){
      try { return JSON.parse(localStorage.getItem(KS.chapters)) || []; }
      catch { return []; }
    }
    function saveChapters(){ localStorage.setItem(KS.chapters, JSON.stringify(chapters)); }
    function loadComments(){
      try { return JSON.parse(localStorage.getItem(KS.comments)) || {}; }
      catch { return {}; }
    }
    function saveComments(){ localStorage.setItem(KS.comments, JSON.stringify(comments)); }

    // ========== GitHub API helpers ==========
    const ghHeaders = (token) => token ? { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } : { 'Accept': 'application/vnd.github+json' };
    async function ghGetContent(path, ref = GH.branch){
      const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(ref)}`;
      const res = await fetch(url, { headers: ghHeaders(localStorage.getItem(GH_TOKEN_KEY) || '') });
      if (res.status === 404) return { sha: null, text: null };
      if (!res.ok) throw new Error('GitHub GET 실패: ' + res.status);
      const json = await res.json();
      if (json.type !== 'file') throw new Error('파일이 아님');
      const text = fromB64(json.content);
      return { sha: json.sha, text };
    }
    async function ghPutContent(path, text, message){
      const token = localStorage.getItem(GH_TOKEN_KEY) || '';
      if (!token) { alert('토큰이 필요합니다. 좌측 “토큰” 버튼으로 저장하세요.'); throw new Error('no token'); }
      // 먼저 현재 sha 조회(없으면 신규 생성)
      let sha = null;
      try {
        const cur = await ghGetContent(path, GH.branch);
        sha = cur.sha;
      } catch (e) { /* ignore */ }
      const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${encodeURIComponent(path)}`;
      const body = {
        message,
        branch: GH.branch,
        content: b64(text),
        sha: sha || undefined
      };
      const res = await fetch(url, {
        method: 'PUT',
        headers: { ...ghHeaders(token), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const t = await res.text().catch(()=> '');
        throw new Error('GitHub PUT 실패: ' + res.status + ' ' + t);
      }
      return res.json();
    }

    async function remoteLoad(){
      try{
        // chapters
        const ch = await ghGetContent(GH.pathChapters, GH.branch);
        if (ch.text){
          chapters = JSON.parse(ch.text);
          saveChapters();
        }
        // comments
        const cm = await ghGetContent(GH.pathComments, GH.branch);
        if (cm.text){
          comments = JSON.parse(cm.text);
          saveComments();
        }
        renderList(document.getElementById('search').value);
        if (chapters.length) selectChapter(chapters.sort((a,b)=> Number(a.no)-Number(b.no))[0].no);
        alert('원격 불러오기 완료');
      }catch(e){
        console.error(e);
        alert('원격 불러오기 실패: ' + e.message);
      }
    }
    async function remoteSave(){
      try{
        const msg = `chore(ddj): sync data ${nowISO()}`;
        await ghPutContent(GH.pathChapters, JSON.stringify(chapters, null, 2), msg);
        await ghPutContent(GH.pathComments, JSON.stringify(comments, null, 2), msg);
        alert('원격 저장 완료');
      }catch(e){
        console.error(e);
        alert('원격 저장 실패: ' + e.message);
      }
    }

    // 장 목록 렌더
    function renderList(filter=''){
      const list = document.getElementById('chapterList');
      list.innerHTML = '';
      const f = (filter || '').trim();
      const items = chapters
        .filter(ch => {
          if (!f) return true;
          const t = `${ch.no} ${ch.orig} ${ch.interp}`.toLowerCase();
          return t.includes(f.toLowerCase());
        })
        .sort((a,b)=> Number(a.no||0) - Number(b.no||0));
      document.getElementById('countPill').textContent = items.length + '장';
      for (const ch of items){
        const div = document.createElement('div');
        div.className = 'list-item' + (String(ch.no) === String(currentNo) ? ' active' : '');
        const snippet = (ch.orig || '').split('\n')[0]?.slice(0,18) || '';
        div.innerHTML = `<div>제 ${esc(ch.no)} 장</div><div class="muted">${esc(snippet)}</div>`;
        div.addEventListener('click', ()=> selectChapter(ch.no));
        list.appendChild(div);
      }
    }

    // 장 선택/미리보기/필드
    function selectChapter(no){
      const ch = chapters.find(x=> String(x.no) === String(no));
      if (!ch) return;
      currentNo = String(ch.no);
      document.getElementById('chapNo').value = ch.no;
      document.getElementById('orig').value = ch.orig || '';
      document.getElementById('interp').value = ch.interp || '';
      document.getElementById('editorTitle').textContent = `장 입력/수정 — 제 ${ch.no} 장`;
      updatePreview();
      renderList(document.getElementById('search').value);
      renderComments();
    }

    function clearEditor(){
      currentNo = null;
      document.getElementById('chapNo').value = nextNo();
      document.getElementById('orig').value = '';
      document.getElementById('interp').value = '';
      document.getElementById('editorTitle').textContent = '장 입력/수정';
      updatePreview();
      document.getElementById('cmtHeader').textContent = '선택된 장: 없음';
      document.getElementById('comments').innerHTML = '';
      renderList(document.getElementById('search').value);
    }

    function nextNo(){
      if (!chapters.length) return 1;
      const maxNo = Math.max(...chapters.map(x=> Number(x.no||0)));
      return maxNo + 1;
    }

    // 저장
    function saveCurrent(){
      const no = (document.getElementById('chapNo').value || '').trim();
      const orig = document.getElementById('orig').value || '';
      const interp = document.getElementById('interp').value || '';
      if (!no){ alert('장 번호를 입력하세요.'); return; }
      const i = chapters.findIndex(x=> String(x.no) === String(no));
      const payload = { no, orig, interp, updatedAt: nowISO() };
      if (i >= 0) chapters[i] = payload;
      else chapters.push(payload);
      saveChapters();
      currentNo = String(no);
      renderList(document.getElementById('search').value);
      selectChapter(no);
      alert('저장 완료');
    }

    // 미리보기 업데이트
    function updatePreview(){
      const no = (document.getElementById('chapNo').value || '').trim() || '-';
      const orig = document.getElementById('orig').value || '';
      const interp = document.getElementById('interp').value || '';
      document.getElementById('vNo').textContent = esc(no);
      document.getElementById('vOrig').innerHTML = esc(orig);
      document.getElementById('vInterp').innerHTML = esc(interp);
      document.getElementById('cmtHeader').textContent =
        currentNo ? `선택된 장: 제 ${currentNo} 장` : '선택된 장: 없음';
    }

    // 댓글 구조 helpers
    function getComments(no){
      const key = String(no);
      if (!comments[key]) comments[key] = [];
      return comments[key];
    }
    function addComment({ no, parentId=null, author='', content='' }){
      const list = getComments(no);
      const item = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        parentId,
        author: (author || '익명').slice(0,40),
        content: (content || '').slice(0, 5000),
        ts: nowISO()
      };
      list.push(item);
      comments[String(no)] = list;
      saveComments();
      renderComments();
    }
    function renderComments(){
      const box = document.getElementById('comments');
      box.innerHTML = '';
      if (!currentNo){ box.innerHTML = '<div class="muted">장을 먼저 선택하세요.</div>'; return; }
      const list = getComments(currentNo).slice().sort((a,b)=> new Date(a.ts)-new Date(b.ts));
      // 트리 구성
      const byParent = {};
      for (const c of list){
        const key = c.parentId || '_root';
        (byParent[key] = byParent[key] || []).push(c);
      }
      const renderNode = (parentId, depth=0) => {
        const arr = byParent[parentId || '_root'] || [];
        for (const c of arr){
          const div = document.createElement('div');
          div.className = 'comment' + (depth>0 ? ' indent' : '');
          div.innerHTML = `
            <div class="meta">${esc(c.author)} · <span class="muted">${esc(c.ts)}</span></div>
            <div class="content">${esc(c.content)}</div>
            <div><button class="reply-btn" data-id="${c.id}">답글</button></div>
            <div class="reply-box" id="reply-${c.id}" style="display:none;">
              <input type="text" class="r-author" placeholder="이름(선택)" style="width:40%;margin:6px 0;">
              <textarea class="r-content" placeholder="답글 내용을 입력하세요."></textarea>
              <div class="row" style="margin-top:6px;">
                <button class="primary r-submit" data-id="${c.id}">등록</button>
                <button class="r-cancel" data-id="${c.id}">취소</button>
              </div>
            </div>
          `;
          box.appendChild(div);
          renderNode(c.id, depth+1);
        }
      };
      renderNode(null, 0);

      // 이벤트 위임(답글 토글/등록/취소)
      box.querySelectorAll('.reply-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.id;
          const area = document.getElementById('reply-'+id);
          area.style.display = area.style.display === 'none' ? 'block' : 'none';
        });
      });
      box.querySelectorAll('.r-cancel').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.id;
          const area = document.getElementById('reply-'+id);
          area.style.display = 'none';
        });
      });
      box.querySelectorAll('.r-submit').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.id;
          const area = document.getElementById('reply-'+id);
          const author = area.querySelector('.r-author').value;
          const content = area.querySelector('.r-content').value;
          if (!content.trim()){ alert('내용을 입력하세요.'); return; }
          addComment({ no: currentNo, parentId: id, author, content });
        });
      });
    }

    // 이벤트 바인딩
    document.getElementById('search').addEventListener('input', e=>{
      renderList(e.target.value);
    });
    document.getElementById('addBtn').addEventListener('click', ()=>{
      const n = nextNo();
      const exists = chapters.some(x=> String(x.no) === String(n));
      if (!exists) {
        chapters.push({ no: String(n), orig: '', interp: '', updatedAt: nowISO() });
        saveChapters();
      }
      selectChapter(n);
    });
    document.getElementById('delBtn').addEventListener('click', ()=>{
      if (!currentNo){ alert('삭제할 장을 선택하세요.'); return; }
      if (!confirm(`제 ${currentNo} 장을 삭제할까요?`)) return;
      chapters = chapters.filter(x=> String(x.no) !== String(currentNo));
      saveChapters();
      delete comments[String(currentNo)];
      saveComments();
      clearEditor();
    });
    document.getElementById('saveBtn').addEventListener('click', saveCurrent);
    document.getElementById('newBtn').addEventListener('click', clearEditor);
    document.getElementById('orig').addEventListener('input', updatePreview);
    document.getElementById('interp').addEventListener('input', updatePreview);
    document.getElementById('chapNo').addEventListener('input', updatePreview);
    document.getElementById('cmtAddBtn').addEventListener('click', ()=>{
      if (!currentNo){ alert('장 선택 후 댓글을 입력하세요.'); return; }
      const author = document.getElementById('cmtAuthor').value;
      const content = document.getElementById('cmtContent').value;
      if (!content.trim()){ alert('댓글 내용을 입력하세요.'); return; }
      addComment({ no: currentNo, parentId: null, author, content });
      document.getElementById('cmtContent').value = '';
    });

    // 동기화 버튼
    document.getElementById('remoteLoadBtn').addEventListener('click', remoteLoad);
    document.getElementById('remoteSaveBtn').addEventListener('click', remoteSave);
    document.getElementById('tokenBtn').addEventListener('click', ()=>{
      const cur = localStorage.getItem(GH_TOKEN_KEY) || '';
      const val = prompt('GitHub Personal Access Token 입력/수정(비워두면 삭제):', cur);
      if (val === null) return;
      if (val.trim()) localStorage.setItem(GH_TOKEN_KEY, val.trim());
      else localStorage.removeItem(GH_TOKEN_KEY);
      document.getElementById('remoteInfo').textContent =
        (localStorage.getItem(GH_TOKEN_KEY) ? '토큰 저장됨 · 저장 가능' : '읽기는 공개, 저장은 토큰 필요');
      alert('토큰 상태가 업데이트되었습니다.');
    });

    // 초기화
    renderList();
    if (chapters.length) {
      selectChapter(chapters.sort((a,b)=> Number(a.no)-Number(b.no))[0].no);
    } else {
      document.getElementById('chapNo').value = 1;
      updatePreview();
    }
  </script>
</body>
</html>
